<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVELOP Dashboard</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
}
.panel {
  width: 85%;
  max-width: 450px;
  padding: 30px 20px;
  text-align: center;
  background: #171725;
  border: 1px solid #7545b8;
  border-radius: 18px;
}
h1 {
  color: #b58aff;
  letter-spacing: 4px;
}
p { color: #aaa; }
button {
  padding: 14px 20px;
  width: 100%;
  border: 0;
  border-radius: 9px;
  background: #8b5cf6;
  color: white;
  font-weight: bold;
  font-size: 16px;
}
</style>
</head>
<body>
<div class="panel">
  <h1>DEVELOP</h1>
  <h2>Discord Dashboard</h2>
  <p>Manage your Discord server in one place.</p>
  <p>● Website Online</p>
  <button onclick="location.href='/auth/discord'">
    Login with Discord
  </button>
</div>
</body>
</html>
